plugins {
    id 'com.android.application'
}

// 本地配置：local.properties 不进仓库。
// 云端网关地址可以预填，省得每次装机手打：
//   tide.server=https://your.host:8443
def localProps = new Properties()
def lpFile = rootProject.file("local.properties")
if (lpFile.exists()) {
    lpFile.withInputStream { localProps.load(it) }
}
def tideServer = localProps.getProperty("tide.server", "")
def releaseStore = localProps.getProperty("tide.release.store", "")
def allowScreenshots = project.findProperty("tide.allowScreenshots") ?: "false"

android {
    namespace 'com.whaleeye.tide'
    compileSdk 34

    defaultConfig {
        applicationId "com.whaleeye.tide"
        minSdk 24
        targetSdk 34
        versionCode 3101
        versionName "0.31.1"

        buildConfigField "String", "TIDE_SERVER", "\"${tideServer}\""
        buildConfigField "boolean", "ALLOW_SCREENSHOTS", allowScreenshots
    }

    // 与 peekphone 同一个调试 keystore：两个 App 同机安装不会因为签名策略冲突
    signingConfigs {
        debug {
            storeFile file("$rootDir/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword localProps.getProperty("tide.release.storePassword", "")
                keyAlias localProps.getProperty("tide.release.keyAlias", "")
                keyPassword localProps.getProperty("tide.release.keyPassword", "")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (releaseStore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildFeatures {
        buildConfig true
    }
}

// 零依赖：不引 AndroidX。列表用 ListView + BaseAdapter 手写，
// 与 peekphone 的构建口径一致（AGP 8.2 + JDK 17 + 无网络依赖）。
dependencies {
    testImplementation 'junit:junit:4.13.2'
}

gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(':app:assembleRelease') && !releaseStore) {
        throw new GradleException(
                'Release signing is not configured: set tide.release.store/storePassword/keyAlias/keyPassword in local.properties'
        )
    }
}
